<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>服务器详情</title>
<style>
html,body{margin:0;padding:0;background:#151515;color:#ccc;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px}.wrap{padding:24px 32px}.back{color:#52bd6b;text-decoration:none}.title{font-size:22px;color:#eee;margin:18px 0 8px}.box{background:#202020;border:1px solid #2d2d2d;padding:18px;margin-top:16px}.row{margin:8px 0;line-height:1.8}.label{color:#888}.status{color:#e4e4e4}.btn{display:inline-block;margin:10px 8px 0 0;padding:8px 18px;border:1px solid #1bad3f;background:#159431;color:#fff;cursor:pointer}.btn2{background:#252525}.log{margin-top:14px;padding:12px;background:#111;border:1px solid #292929;white-space:pre-wrap;word-break:break-all;color:#9f9f9f;min-height:54px}.warn{color:#d6a24e}.ok{color:#52bd6b}.err{color:#de6455}</style>
<script>
function gid(){var m=location.search.match(/[?&]id=(\d+)/);return m?parseInt(m[1],10):2;}
function log(s,cls){var e=document.getElementById('log');e.className='log '+(cls||'');e.innerText=s;}
function checkBridge(){
  var id=gid();
  try{
    if(window.external && typeof window.external.MCPCBox_CheckGameResIsExit!=='undefined'){
      var v=window.external.MCPCBox_CheckGameResIsExit(id);
      log('桥接成功\n资源 ID：'+id+'\n返回值：'+v,'ok');return;
    }
  }catch(e){log('桥接失败\n结果：'+(e.message||String(e)),'err');return;}
  log('桥接失败','err');
}
function protocolById(){
  log('正在调用盒子协议：\nmcpcbox://download_pure_version=^2^\n\n请观察是否进入左下角“下载中心”，以及是否出现任务。','ok');
  location.href='mcpcbox://download_pure_version=^2^';
}
function protocolByVersion(){
  log('正在调用盒子协议：\nmcpcbox://download_pure_version=^OnlineClientTest^\n\n请观察是否进入左下角“下载中心”，以及是否出现任务。','ok');
  location.href='mcpcbox://download_pure_version=^OnlineClientTest^';
}
function testOldDownload(){
  var id=gid();
  if(!confirm('这会调用旧 MCPCBox_DownloadGameRes('+id+')，可能弹出旧下载管理窗口。是否继续？')) return;
  try{
    window.external.MCPCBox_DownloadGameRes(id);
    log('旧下载接口调用已执行\n资源 ID：'+id+'\n返回值：未读取\n\n仅用于诊断。','ok');
  }catch(e){log('旧下载接口调用异常\n结果：'+(e.message||String(e)),'err');}
}
window.onload=function(){document.getElementById('rid').innerText=gid();};
</script>
</head>
<body>
<div class="wrap">
 <a class="back" href="index.html?v=7">← 返回服务器列表</a>
 <div class="title">联机客户端协议测试</div>
 <div class="box">
  <div class="row"><span class="label">客户端资源 ID：</span><span id="rid">2</span></div>
  <div class="row"><span class="label">版本标识：</span><span class="status">OnlineClientTest</span></div>
  <div class="row warn">新版 window.external 接口未暴露给此网页，本轮改测盒子现有的 mcpcbox://download_pure_version 协议。</div>
  <button class="btn btn2" onclick="checkBridge()">检测资源状态</button>
  <button class="btn" onclick="protocolById()">协议 A：资源 ID 2</button>
  <button class="btn" onclick="protocolByVersion()">协议 B：版本标识</button>
  <button class="btn btn2" onclick="testOldDownload()">旧下载调用（诊断）</button>
  <div id="log" class="log">先测试“协议 A：资源 ID 2”。</div>
 </div>
</div>
</body>
</html>
