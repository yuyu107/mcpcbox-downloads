<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>服务器详情</title>
<style>
html,body{margin:0;padding:0;background:#151515;color:#ccc;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px}.wrap{padding:24px 32px}.back{color:#52bd6b;text-decoration:none}.title{font-size:22px;color:#eee;margin:18px 0 8px}.box{background:#202020;border:1px solid #2d2d2d;padding:18px;margin-top:16px}.row{margin:8px 0;line-height:1.8}.label{color:#888}.status{color:#e4e4e4}.btn{display:inline-block;margin:10px 8px 0 0;padding:8px 18px;border:1px solid #1bad3f;background:#159431;color:#fff;cursor:pointer}.btn2{background:#252525}.log{margin-top:14px;padding:12px;background:#111;border:1px solid #292929;white-space:pre-wrap;word-break:break-all;color:#9f9f9f;min-height:54px}.warn{color:#d6a24e}.ok{color:#52bd6b}.err{color:#de6455}</style>
<script>
function gid(){var m=location.search.match(/[?&]id=(\d+)/);return m?parseInt(m[1],10):2;}
function log(s,cls){var e=document.getElementById('log');e.className='log '+(cls||'');e.innerText=s;}
function checkResource(){
  var id=gid();
  try{
    var v=window.external.MCPCBox_CheckGameResIsExit(id);
    log('资源检测完成\n调用位置：window.external.MCPCBox_CheckGameResIsExit\n资源 ID：'+id+'\n返回值：'+v,'ok');
  }catch(e){log('资源检测失败\n结果：'+(e.message||String(e)),'err');}
}
function downloadGame(){
  var id=gid();
  try{
    window.external.MCPCBox_DownloadGameRes(id);
    log('原版下载接口已调用\n调用位置：window.external.MCPCBox_DownloadGameRes\n资源 ID：'+id+'\n返回值：未读取\n\n请观察原版下载管理是否出现任务。','ok');
  }catch(e){log('下载接口调用异常\n结果：'+(e.message||String(e)),'err');}
}
window.onload=function(){document.getElementById('rid').innerText=gid();};
</script>
</head>
<body>
<div class="wrap">
 <a class="back" href="index.html?v=8">← 返回服务器列表</a>
 <div class="title">联机客户端测试服务器</div>
 <div class="box">
  <div class="row"><span class="label">客户端资源 ID：</span><span id="rid">2</span></div>
  <div class="row"><span class="label">版本标识：</span><span class="status">OnlineClientTest</span></div>
  <div class="row warn">本页只使用盒子原版联机客户端下载接口。本测试客户端只是一个很小的诊断文件。</div>
  <button class="btn btn2" onclick="checkResource()">检测资源状态</button>
  <button class="btn" onclick="downloadGame()">下载游戏</button>
  <div id="log" class="log">建议先点击“检测资源状态”，再点击“下载游戏”。</div>
 </div>
</div>
</body>
</html>
