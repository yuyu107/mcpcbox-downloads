<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>精彩视频 - 多玩我的世界盒子</title>
  <style>
    html, body { margin: 0; padding: 0; background: #151515; color: #d6d6d6; font-family: "Microsoft YaHei", Arial, sans-serif; }
    body { min-width: 760px; }
    .header { height: 72px; border-bottom: 1px solid #282828; background: #181818; }
    .header-inner { width: 92%; margin: 0 auto; padding-top: 18px; }
    .title { color: #ffffff; font-size: 24px; line-height: 34px; }
    .title span { color: #20c45a; }
    .subtitle { color: #777777; font-size: 12px; margin-left: 14px; }
    .notice { width: 92%; margin: 22px auto 0; padding: 14px 16px; background: #1e261f; border-left: 4px solid #20c45a; color: #aebcaf; box-sizing: border-box; }
    .content { width: 92%; margin: 20px auto 40px; overflow: hidden; }
    .card { float: left; width: 31.3%; margin: 0 3% 20px 0; background: #202020; border: 1px solid #303030; box-sizing: border-box; }
    .card.last { margin-right: 0; }
    .cover { height: 132px; position: relative; background: #26362a; border-bottom: 1px solid #303030; }
    .cover.green { background: #183d25; }
    .cover.gray { background: #292929; }
    .cover-mark { position: absolute; left: 20px; top: 25px; width: 58px; height: 58px; line-height: 58px; text-align: center; background: #20c45a; color: #101010; font-size: 28px; font-weight: bold; }
    .cover-text { position: absolute; left: 96px; top: 38px; right: 12px; color: #eeeeee; font-size: 18px; line-height: 28px; }
    .card-body { padding: 14px 16px 16px; }
    .card-title { color: #f0f0f0; font-size: 16px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; }
    .desc { height: 42px; color: #8d8d8d; font-size: 13px; line-height: 21px; }
    .button { display: inline-block; margin-top: 12px; padding: 7px 18px; background: #20c45a; color: #ffffff; text-decoration: none; font-size: 13px; }
    .button:hover { background: #27d665; }
    .footer { clear: both; width: 92%; margin: 0 auto; padding: 18px 0 24px; border-top: 1px solid #282828; color: #666666; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <span class="title"><span>精彩</span>视频</span>
      <span class="subtitle">MCPCBox Community Fix</span>
    </div>
  </div>

  <div class="notice">原精彩视频服务已经停止，本页面由社区修复项目重新提供。页面内容可在 GitHub 仓库中继续编辑和扩充。</div>

  <div class="content">
    <div class="card">
      <div class="cover green">
        <div class="cover-mark">修</div>
        <div class="cover-text">盒子修复项目</div>
      </div>
      <div class="card-body">
        <div class="card-title">MCPCBox Community Fix</div>
        <div class="desc">查看最新修复进度、版本说明和源码。</div>
        <a class="button" href="https://github.com/yuyu107/mcpcbox-community-fix" target="_blank">打开项目</a>
      </div>
    </div>

    <div class="card">
      <div class="cover">
        <div class="cover-mark">MC</div>
        <div class="cover-text">Minecraft 视频</div>
      </div>
      <div class="card-body">
        <div class="card-title">搜索我的世界相关视频</div>
        <div class="desc">前往哔哩哔哩查看教程、实况和怀旧内容。</div>
        <a class="button" href="https://search.bilibili.com/all?keyword=%E6%88%91%E7%9A%84%E4%B8%96%E7%95%8C" target="_blank">查看视频</a>
      </div>
    </div>

    <div class="card last">
      <div class="cover gray">
        <div class="cover-mark">+</div>
        <div class="cover-text">等待添加</div>
      </div>
      <div class="card-body">
        <div class="card-title">后续视频入口</div>
        <div class="desc">可以继续加入指定 UP 主、系列教程或修复记录。</div>
        <a class="button" href="https://github.com/yuyu107/mcpcbox-community-fix/issues" target="_blank">提交建议</a>
      </div>
    </div>
  </div>

  <div class="footer">非官方社区维护页面 · 原站点及相关商标归各自权利人所有</div>
</body>
</html>
